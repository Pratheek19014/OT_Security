%YAML 1.1
---

# Suricata Configuration for OT/ICS S7comm Monitoring
# Monitoring Siemens PLC communication over TCP/IP
# Network: PLC1 (192.168.0.20) -> PLC2 (192.168.0.1), Laptop (192.168.0.30)

vars:
  address-groups:
    # FIXED: Corrected subnet to match actual lab network
    HOME_NET: "[192.168.0.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"

    # OT-specific device groups
    PLC_SENDER: "192.168.0.20"      # PLC 1 - sends data
    PLC_RECEIVER: "192.168.0.1"     # PLC 2 - receives data
    IDS_SENSOR: "192.168.0.30"      # Your laptop running Suricata

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544
    S7COMM_PORTS: 102               # Siemens S7 communication port

# Default logging directory
default-log-dir: /var/log/suricata/

stats:
  enabled: yes
  interval: 8

outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            ethernet: yes
            metadata: yes
            tagged-packets: yes
        - anomaly:
            enabled: yes
            types:
        - http:
            extended: yes
        - dns:
            enabled: yes
        - tls:
            extended: yes
        - files:
            force-magic: yes
        - smtp:
        - ssh
        - stats:
            totals: yes
            threads: no
            deltas: no
        - flow

  - unified2-alert:
      enabled: no

  - http-log:
      enabled: no

  - tls-log:
      enabled: no

  - dns-log:
      enabled: no

  - pcap-log:
      enabled: yes
      filename: log.pcap
      limit: 500mb
      max-files: 10
      compression: none
      mode: normal
      use-stream-depth: no
      honor-pass-rules: no

  - alert-debug:
      enabled: no
      filename: alert-debug.log
      append: yes

  - alert-prelude:
      enabled: no

  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes
      threads: yes

  - syslog:
      enabled: no

  - file-store:
      version: 2
      enabled: no

  - tcp-data:
      enabled: no
      type: file
      filename: tcp-data.log

  - http-body-data:
      enabled: no
      type: file
      filename: http-data.log

  - - lua:
      enabled: yes
      scripts-dir: /etc/suricata/lua/

logging:
  default-log-level: info
  outputs:
  - console:
      enabled: yes
  - file:
      enabled: yes
      level: info
      filename: /var/log/suricata/suricata.log
  - syslog:
      enabled: no

# FIXED: Interface changed from eth0 to enp7s0 (your actual Linux interface)
# Running in passive IDS/sniffing mode - laptop is sniffing switch traffic
af-packet:
  - interface: enp7s0
    threads: 1
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

# FIXED: Interface changed from eth0 to enp7s0
pcap:
  - interface: enp7s0
    buffer-size: 32768
    checksum-checks: auto

# Application layer protocols
app-layer:
  protocols:
    ether:
      detection-enabled: yes
    profinet:
      enabled: yes
      detection-enabled: yes
    rfb:
      enabled: yes
    mqtt:
      enabled: yes
      max-msg-length: 1mb
    krb5:
      enabled: yes
    snmp:
      enabled: yes
    ikev2:
      enabled: yes
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    dcerpc:
      enabled: yes
    ftp:
      enabled: yes
    ssh:
      enabled: yes
    smtp:
      enabled: yes
    imap:
      enabled: detection-only
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445
    nfs:
      enabled: yes
    tftp:
      enabled: yes
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    http:
      enabled: yes
      libhtp:
         default-config:
           personality: IDS
           request-body-limit: 100kb
           response-body-limit: 100kb
           request-body-minimal-inspect-size: 32kb
           request-body-inspect-window: 4kb
           response-body-minimal-inspect-size: 40kb
           response-body-inspect-window: 16kb
           response-body-decompress-layer-limit: 2
           http-body-inline: auto
           swf-decompression:
             enabled: yes
             type: both
             compress-depth: 0
             decompress-depth: 0
           double-decode-path: no
           double-decode-query: no
    modbus:
      enabled: yes
      detection-ports:
        dp: 502
      stream-depth: 0
    dnp3:
      enabled: yes
      detection-ports:
        dp: 20000
    enip:
      enabled: yes
      detection-ports:
        dp: 44818
        sp: 44818


decoder:
  ethernet:
    enabled: yes
  vlan:
    use-vlan-id: true
    vlan-header-0: true

# Suricata core settings
engine-analysis:
  rules-fast-pattern: yes
  rules: yes

pcre:
  match-limit: 3500
  match-limit-recursion: 1500

host-mode: auto

exception-policy: auto

defrag:
  memcap: 32mb
  hash-size: 65536
  trackers: 65535
  max-frags: 65535
  prealloc: yes
  timeout: 60

flow:
  memcap: 128mb
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30

stream:
  memcap: 64mb
  checksum-validation: no
  midstream: true
  async-oneside: true
  inline: auto
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

host:
  hash-size: 4096
  prealloc: 1000
  memcap: 32mb

reputation-categories-file: /etc/suricata/rules/reputation-categories.txt
default-reputation-path: /etc/suricata/rules
reputation-files:

detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 25
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000
  prefilter:
    default: mpm
  grouping:
  profiling:
    grouping:
      dump-to-disk: false
      include-rules: false
      include-mpm-stats: false

mpm-algo: auto
spm-algo: auto

threading:
  set-cpu-affinity: no
  cpu-affinity:
    - management-cpu-set:
        cpu: [ 0 ]
    - receive-cpu-set:
        cpu: [ 0 ]
    - worker-cpu-set:
        cpu: [ "all" ]
  detect-thread-ratio: 1.0

profiling:
  rules:
    enabled: yes
    filename: rule_perf.log
    append: yes
    limit: 10
    json: yes
  keywords:
    enabled: yes
    filename: keyword_perf.log
    append: yes
  prefilter:
    enabled: yes
    filename: prefilter_perf.log
    append: yes
  rulegroups:
    enabled: yes
    filename: rule_group_perf.log
    append: yes
  packets:
    enabled: yes
    filename: packet_stats.log
    append: yes
    csv:
      enabled: no
      filename: packet_stats.csv
  locks:
    enabled: no
    filename: lock_stats.log
    append: yes
  pcap-log:
    enabled: no
    filename: pcaplog_stats.log
    append: yes

nfq:

capture:

unix-command:
  enabled: auto

legacy:
  uricontent: enabled

# Rule files
default-rule-path: /etc/suricata/rules

rule-files:
  - profinet.rules

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

action-order:
  - pass
  - drop
  - reject
  - alert
 
 
security:
  lua:
    allow-rules: true
    allow-scripts: true

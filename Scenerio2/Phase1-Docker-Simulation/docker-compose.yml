version: "3.9"

services:

  plc:
    container_name: ot_plc
    build: ./plc
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      ot_net:
        ipv4_address: 192.168.100.10

  hmi:
    container_name: ot_hmi
    build: ./hmi
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - plc
    networks:
      ot_net:
        ipv4_address: 192.168.100.20

  ids:
    container_name: ot_ids
    build: ./ids
    network_mode: "container:ot_plc"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - plc
    volumes:
      - ./ids/suricata.yaml:/etc/suricata/suricata.yaml
      - ./ids/rules:/etc/suricata/rules
    command: suricata -i eth0 -c /etc/suricata/suricata.yaml

networks:
  ot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

